name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project FM1Hub.xcodeproj -scheme FM1Hub -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log | grep -E 'error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build/xcodebuild.log || { tail -40 build/xcodebuild.log; exit 1; }
      - name: Run the unit tests
        run: |
          set -o pipefail
          mkdir -p build
          # the first available iPhone simulator, whatever this runner image ships
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; c=[d for v in ds.values() for d in v if d.get('isAvailable') and 'iPhone' in d['name']]; print(c[0]['udid'] if c else '')")
          [ -n "$udid" ] || { echo '::error::no iPhone simulator available on this runner'; exit 1; }
          xcodebuild -project FM1Hub.xcodeproj -scheme FM1Hub -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee build/xcodebuild-test.log | grep -E 'error:|failed|passed|TEST' || true
          grep -q 'TEST SUCCEEDED' build/xcodebuild-test.log || { tail -60 build/xcodebuild-test.log; exit 1; }
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/xcodebuild.log
            build/xcodebuild-test.log
          if-no-files-found: ignore

  testflight:
    name: Archive and upload to TestFlight
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        id: secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight upload skipped. Missing repository secrets:$missing (see README, 'TestFlight from GitHub')."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          # The secret may be the raw .p8 text or its base64.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          fi
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        if: steps.secrets.outputs.ready == 'true'
        # Unsigned on purpose: signing here makes Xcode create a new development certificate on every fresh runner,
        # and Apple's account limit fills up. The export below signs once, with Apple's cloud-managed distribution
        # certificate, which is kept at Apple and reused.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project FM1Hub.xcodeproj -scheme FM1Hub -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FM1Hub.xcarchive \
            -derivedDataPath build/DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d).${{ github.run_number }}" \
            archive 2>&1 | tee build/archive.log | grep -E 'error:|ARCHIVE' || true
          grep -q 'ARCHIVE SUCCEEDED' build/archive.log || { tail -60 build/archive.log; exit 1; }

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/FM1Hub.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | grep -vE '^\s*$' || true
          grep -q 'EXPORT SUCCEEDED' build/export.log || { tail -60 build/export.log; exit 1; }
          echo "Uploaded. It shows up in App Store Connect > TestFlight after Apple's processing (usually 5-15 minutes)."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            build/archive.log
            build/export.log
          if-no-files-found: ignore
