name: App Store

# Run by hand: screenshots, listing, price, age rating, build for version 1.0, status. Never submits for review.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload listing and screenshots to App Store Connect
        type: boolean
        default: true

jobs:
  appstore:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project FM1Hub.xcodeproj -scheme FM1Hub -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee build/build.log | grep -E 'error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build/build.log || { tail -40 build/build.log; exit 1; }

      - name: Take the screenshots
        run: |
          APP=build/DD/Build/Products/Debug-iphonesimulator/FM1Hub.app
          OUT=appstore/screenshots/en-US
          mkdir -p "$OUT"
          pick() {  # the newest available simulator whose name matches
            xcrun simctl list -j devices available | python3 -c "
          import json,re,sys
          devs=[d for r,l in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in l]
          m=[d for d in devs if re.search(sys.argv[1], d['name'])]
          print(m[-1]['udid'] if m else '')" "$1"
          }
          shoot() {  # device-udid prefix
            local dev=$1 pre=$2
            xcrun simctl boot "$dev" || true
            xcrun simctl bootstatus "$dev" -b
            xcrun simctl status_bar "$dev" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi || true
            xcrun simctl ui "$dev" appearance dark || true
            xcrun simctl install "$dev" "$APP"
            n=0
            while IFS='|' read -r name args; do
              n=$((n+1))
              xcrun simctl terminate "$dev" com.debreczi.fm1hub 2>/dev/null || true
              xcrun simctl launch "$dev" com.debreczi.fm1hub -FM1Screenshots YES $args >/dev/null
              sleep 14
              xcrun simctl io "$dev" screenshot "$OUT/${pre}_${n}_${name}.png"
              echo "shot $OUT/${pre}_${n}_${name}.png"
            done <<'LIST'
          firmwares|-FM1Tab 0
          detail|-FM1Tab 0 -FM1Open x0x
          installing|-FM1Tab 0 -FM1Job YES
          device|-FM1Tab 1
          backups|-FM1Tab 2
          history|-FM1Tab 3
          LIST
            xcrun simctl shutdown "$dev" || true
          }
          PHONE=$(pick 'iPhone.*Pro Max')
          PAD=$(pick 'iPad Pro.*13')
          echo "iPhone: $PHONE  iPad: $PAD"
          [ -n "$PHONE" ] && shoot "$PHONE" iphone
          [ -n "$PAD" ] && shoot "$PAD" ipad
          sips -g pixelWidth -g pixelHeight "$OUT"/*.png | paste - - - | awk '{print $1, $3"x"$5}'

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: appstore/screenshots

      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          fi
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          python3 - <<PY
          import json, os
          key = open(os.path.expanduser("~/private_keys/AuthKey_${ASC_KEY_ID}.p8")).read()
          json.dump({"key_id": "${ASC_KEY_ID}", "issuer_id": "${ASC_ISSUER_ID}", "key": key, "in_house": False},
                    open(os.path.expanduser("~/private_keys/api_key.json"), "w"))
          PY

      - name: Upload listing and screenshots
        if: inputs.upload
        run: |
          gem list -i fastlane >/dev/null 2>&1 || sudo gem install fastlane -N --quiet
          fastlane --version | tail -1
          fastlane deliver \
            --api_key_path ~/private_keys/api_key.json \
            --app_identifier com.debreczi.fm1hub \
            --app_version 1.0 \
            --metadata_path appstore/metadata \
            --screenshots_path appstore/screenshots \
            --overwrite_screenshots true \
            --skip_binary_upload true \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true

      - name: Price, age rating, build, status
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography requests
          python3 appstore/asc.py
